<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Idle Clicker</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="game-container">
        <h1>Idle Clicker</h1>

        <img src="assets/mascot.png" alt="Mascot" class="mascot">

        <div class="stats">
            <p>💰 <span id="score">0</span> points</p>
            <p>⚡ <span id="rate">0</span> pts/sec</p>
        </div>

        <div class="buttons">
            <button id="clickBtn">
                <img src="assets/coin.png" alt="Click" /> Click!
            </button>
            <button id="buyAutoClickerBtn">
                <img src="assets/auto.png" alt="Auto" /> Buy AutoClicker (<span id="autoClickerCost">10</span>)
            </button>
            <button id="upgradeRateBtn">
                ⚡ Upgrade Rate (<span id="rateUpgradeCost">25</span>)
            </button>
            <button id="megaClickBtn" style="display: none;"> Mega Click (+50)</button>
            <button id="prestigeBtn" disabled>🔁 Prestige (1000 pts)</button>
            <p id="prestigeStats">Prestige Points: <span id="prestigePoints">0</span></p>


        </div>

        <div id="popupContainer"></div>
    </div>
    <!-- Upgrade Store Modal -->
    <div id="upgradeModal" class="modal">
        <div class="modal-content">
            <span id="closeUpgradeModal" class="close">&times;</span>
            <h2>🛒 Upgrade Store</h2>
            <button id="upgradeGoldenClicksBtn">Golden Clicks (+5/click) - 100 pts</button>
            <button id="upgradeSuperAutoClickerBtn">Super AutoClicker (+5 rate) - 200 pts</button>
            <button id="upgradeDoubleIncomeBtn">Double Income (x2) - 500 pts</button>
        </div>
    </div>

    <!-- Open Modal Button -->
    <button id="openUpgradeModalBtn" style="display: none;">Open Upgrade Store</button>

    <script type="module" src="./app.js"></script>
</body>

</html>
